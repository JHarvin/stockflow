server:
  port: 8080

spring:
  application:
    name: inventory-service

  # Base de Datos H2 en memoria
  datasource:
    url: jdbc:h2:mem:stockflow_db;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password

    # 2.2 Connection Pooling ? HikariCP
    hikari:
      # Se define un pool de 10 para manejar carga media sin saturar memoria.
      maximum-pool-size: 10
      # 5 conexiones inactivas garantizan respuesta rápida ante picos de tráfico.
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# 2.3 Resilience4j ? Tolerancia a fallos
resilience4j:
  circuitbreaker:
    instances:
      alertService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      movementRetry:
        maxAttempts: 3
        waitDuration: 2s
        enable-exponential-backoff: true

  ratelimiter:
    instances:
      historyLimiter:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0

# 2.5 Spring Actuator (Observabilidad)
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always
  info:
    app:
      name: ${spring.application.name}
      version: 1.0.0
      description: API de monitoreo de inventario en tiempo real para StockFlow Inc.
