<div class="dashboard-container">
  <h1>Panel de inventario stockFlow</h1>

  <!-- Signals  para señales de estado -->
  <div class="kpi-grid">
    <mat-card class="kpi-card">
      <mat-card-subtitle>Total productos</mat-card-subtitle>
      <mat-card-title>{{ totalProducts() }}</mat-card-title>
    </mat-card>

    <mat-card class="kpi-card critical">
      <mat-card-subtitle>Stock crítico</mat-card-subtitle>
      <mat-card-title>{{ criticalCount() }}</mat-card-title>
    </mat-card>
  </div>

  <!-- Tabla de Productos   -->
  <mat-card class="table-card">
    <table mat-table [dataSource]="products()" class="mat-elevation-z8">
      
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Producto </th>
        <td mat-cell *matCellDef="let p"> {{p.name}} </td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef> Stock </th>
        <td mat-cell *matCellDef="let p"> 
          <span [class.warning]="p.currentStock <= p.minStock">{{p.currentStock}}</span> 
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let p">
          <button mat-button color="primary" (click)="selectProduct(p.id)">Ver historial</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['name', 'stock', 'actions']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['name', 'stock', 'actions'];"></tr>
    </table>
  </mat-card>

  <!--  @defer -->
  @if (selectedProductId()) {
  <div class="history-section">
    <h3>Historial</h3>
    <!-- when<>null -->
    @defer (when selectedProductId()) {
      <app-product-history [productId]="selectedProductId()!"></app-product-history>
    } @placeholder {
      
      <p>Cargando...</p>
    }
  </div>
  }
</div>
